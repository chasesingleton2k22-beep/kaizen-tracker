// ASSIGN PANEL — inline opportunity-to-action-item workflow
// ═══════════════════════════════════════════════════════════
function toggleAssignPanel(opId){
  const wrap=document.getElementById('apw_'+opId);
  if(!wrap)return;
  const opening=!wrap.classList.contains('open');
  document.querySelectorAll('.op-panel-wrap.open').forEach(el=>{if(el!==wrap)el.classList.remove('open');});
  if(opening){
    _panelState[opId]={owner:'',priority:'Medium',cats:[],status:'Not Started'};
    wrap.classList.add('open');
  } else {
    wrap.classList.remove('open');
    delete _panelState[opId];
  }
}
function cancelAssignPanel(opId){
  const wrap=document.getElementById('apw_'+opId);
  if(wrap)wrap.classList.remove('open');
  delete _panelState[opId];
}
function selectAssignOwner(el){
  const opId=el.dataset.opid,name=el.dataset.name;
  if(!_panelState[opId])_panelState[opId]={owner:'',priority:'Medium',cats:[],status:'Not Started'};
  _panelState[opId].owner=_panelState[opId].owner===name?'':name;
  document.querySelectorAll('#apw_'+opId+' .owner-chip').forEach(c=>c.classList.toggle('sel',c.dataset.name===_panelState[opId].owner));
  const err=document.getElementById('aperr_owner_'+opId);
  if(err&&_panelState[opId].owner)err.classList.remove('show');
}
function selectAssignPriority(el){
  const opId=el.dataset.opid,val=el.dataset.val;
  if(!_panelState[opId])_panelState[opId]={owner:'',priority:'Medium',cats:[],status:'Not Started'};
  _panelState[opId].priority=val;
  document.querySelectorAll('#apw_'+opId+' .ap-priority').forEach(b=>b.classList.toggle('sel',b.dataset.val===val));
}
function toggleAssignCat(el){
  const opId=el.dataset.opid,cat=el.dataset.cat;
  if(!_panelState[opId])_panelState[opId]={owner:'',priority:'Medium',cats:[],status:'Not Started'};
  const cats=_panelState[opId].cats,i=cats.indexOf(cat);
  if(i>-1)cats.splice(i,1);else cats.push(cat);
  // cat-chip uses 'on' class (matches existing .cat-chip.on CSS)
  document.querySelectorAll('#apw_'+opId+' .ap-cat').forEach(c=>c.classList.toggle('on',cats.includes(c.dataset.cat)));
  const err=document.getElementById('aperr_cat_'+opId);
  if(err&&cats.length>0)err.classList.remove('show');
}
function selectAssignStatus(el){
  const opId=el.dataset.opid,val=el.dataset.val;
  if(!_panelState[opId])_panelState[opId]={owner:'',priority:'Medium',cats:[],status:'Not Started'};
  _panelState[opId].status=val;
  document.querySelectorAll('#apw_'+opId+' .ap-status').forEach(b=>b.classList.toggle('sel',b.dataset.val===val));
}
function submitAssignItem(code,opId,rank){
  if(!_panelState[opId]){toast('Please open the form first');return;}
  const st=_panelState[opId];
  const ev=DB.getEvent(code);
  const pts=(ev?.participants)||[];
  const titleEl=document.getElementById('aptitle_'+opId);
  const dateEl=document.getElementById('apdate_'+opId);
  const notesEl=document.getElementById('apnotes_'+opId);
  const title=(titleEl?.value||'').trim();
  const dueDate=dateEl?.value||'';
  const notes=(notesEl?.value||'').trim();
  let owner=pts.length?st.owner:(document.getElementById('apowner_text_'+opId)?.value||'').trim();
  // Clear then show validation errors
  document.querySelectorAll('#apw_'+opId+' .val-err').forEach(e=>e.classList.remove('show'));
  let hasErr=false;
  const showErr=(id)=>{const e=document.getElementById(id);if(e)e.classList.add('show');hasErr=true;};
  if(!title)showErr('aperr_title_'+opId);
  if(!owner)showErr('aperr_owner_'+opId);
  if(!dueDate)showErr('aperr_date_'+opId);
  if(!st.cats.length)showErr('aperr_cat_'+opId);
  if(hasErr)return;
  DB.addItem(code,{description:title,owner,dueDate,priority:st.priority,categories:[...st.cats],status:st.status,comment:notes,fromOpRank:rank,fromOpId:opId});
  if(ev){
    (ev.opportunities||[]).forEach(o=>{if(o.id===opId)o.assigned=true;});
    if(ev.voting?.ranked)ev.voting.ranked.forEach(o=>{if(o.id===opId)o.assigned=true;});
    DB.saveEvent(ev);
  }
  delete _panelState[opId];
  toast('Action item created!');
  setTimeout(()=>renderEvent(code,'admin'),300);
}

function doUnassignOpportunity(code,opId,role){
  if(!confirm('This will remove the linked action item. Continue?'))return;
  const ev=DB.getEvent(code);if(!ev)return;
  const items=DB.getItems(code);
  const linked=items.find(i=>i.fromOpId===opId);
  if(linked)DB.deleteItem(code,linked.id);
  (ev.opportunities||[]).forEach(o=>{if(o.id===opId)delete o.assigned;});
  if(ev.voting&&ev.voting.ranked)ev.voting.ranked.forEach(o=>{if(o.id===opId)delete o.assigned;});
  DB.saveEvent(ev);
  toast('Unassigned — action item removed.');
  renderEvent(code,role);
}

// PASS-THE-TABLET VOTING
// ═══════════════════════════════════════════════════════════
function showVotingConfirmation(code){
  const ev=DB.getEvent(code);if(!ev)return;
  if(!(ev.opportunities?.length)){toast('Add at least one opportunity first');return;}
  modal(`
    <div class="modal-hdr"><span class="modal-title">Start Voting</span><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body" style="text-align:center;padding:32px 24px;">
      <div style="font-size:52px;margin-bottom:16px;">🗳️</div>
      <h3 style="font-size:20px;font-weight:900;color:var(--navy);margin-bottom:8px;">Ready to start voting?</h3>
      <p class="txt-sm txt-muted mb4">Pass the tablet to each participant to rate the opportunities.</p>
      <div class="flex g2">
        <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn btn-gold" style="flex:1" onclick="closeModal();startVotingSession('${esc(code)}')">Confirm</button>
      </div>
    </div>
  `);
}

function startVotingSession(code){
  DB.saveVotes2(code,[]);
  const ev=DB.getEvent(code);if(!ev)return;
  if(!ev.voting)ev.voting={};
  ev.voting.status='voting';ev.voting.ranked=null;ev.voting.voterCount=0;
  DB.saveEvent(ev);
  renderVotingOpportunity(code,1,0);
}

function renderVotingOpportunity(code,voterNum,opIdx){
  _vtRating=null;
  const ev=DB.getEvent(code);if(!ev)return;
  const ops=ev.opportunities||[];const op=ops[opIdx];if(!op)return;
  const N=ops.length;const pct=(opIdx/N)*100;
  renderVoting(`
    <div class="vfs">
      <div class="vfs-escape-zone" onclick="handleVotingEscape('${esc(code)}')"></div>
      <div class="vfs-inner">
        <div class="vfs-event">${esc(ev.name)}</div>
        <div class="vfs-voter">Voter ${voterNum}</div>
        <div class="vfs-prog"><div class="vfs-prog-fill" style="width:${pct}%"></div></div>
        <div class="vfs-opp-count">Opportunity ${opIdx+1} of ${N}</div>
        <div class="vfs-opp-text">${esc(op.description)}</div>
        <div class="vfs-num-row" id="vt-num-row">
          ${[1,2,3,4,5].map(n=>`<button class="vfs-num-btn" id="vtn-${n}" onclick="selectVotingRating(${n},'${esc(code)}',${voterNum},${opIdx})">${n}</button>`).join('')}
        </div>
        <div class="vfs-hint">1 = low priority &nbsp;·&nbsp; 5 = high priority</div>
        <button id="vt-submit" class="vfs-submit disabled">SUBMIT VOTE</button>
      </div>
    </div>
  `);
}

function selectVotingRating(n,code,voterNum,opIdx){
  _vtRating=n;
  [1,2,3,4,5].forEach(i=>{
    const btn=document.getElementById('vtn-'+i);
    if(btn)btn.className='vfs-num-btn'+(i===n?' sel':'');
  });
  const sub=document.getElementById('vt-submit');
  if(sub){sub.className='vfs-submit ready';sub.onclick=()=>submitVotingRating(code,voterNum,opIdx);}
}

function submitVotingRating(code,voterNum,opIdx){
  if(_vtRating===null)return;
  const ev=DB.getEvent(code);if(!ev)return;
  const ops=ev.opportunities||[];const op=ops[opIdx];if(!op)return;
  const votes=DB.getVotes2(code);
  votes.push({opportunityId:op.id,rating:_vtRating,voterNumber:voterNum,timestamp:new Date().toISOString()});
  DB.saveVotes2(code,votes);
  const isLast=opIdx===ops.length-1;
  if(isLast)renderHandoffScreen(code,voterNum);
  else renderVoteConfirmation(code,voterNum,opIdx);
}

function renderVoteConfirmation(code,voterNum,opIdx){
  const ev=DB.getEvent(code);if(!ev)return;
  const N=ev.opportunities?.length||0;
  renderVoting(`
    <div class="vfs">
      <div class="vfs-escape-zone" onclick="handleVotingEscape('${esc(code)}')"></div>
      <div class="vfs-inner" style="justify-content:center;">
        <div class="vfc-check">✅</div>
        <div class="vfc-title">Vote Recorded!</div>
        <div class="vfc-sub">Opportunity ${opIdx+1} of ${N} complete</div>
        <button class="vfc-btn-next" onclick="renderVotingOpportunity('${esc(code)}',${voterNum},${opIdx+1})">NEXT OPPORTUNITY</button>
        <button class="vfc-btn-done" onclick="renderHandoffScreen('${esc(code)}',${voterNum})">DONE VOTING — PASS TO NEXT PERSON</button>
      </div>
    </div>
  `);
}

function renderHandoffScreen(code,voterNum){
  const ev=DB.getEvent(code);if(!ev)return;
  renderVoting(`
    <div class="vfs">
      <div class="vfs-escape-zone" onclick="handleVotingEscape('${esc(code)}')"></div>
      <div class="vfs-inner" style="justify-content:center;">
        <div class="vfh-complete">Voter ${voterNum} complete.</div>
        <button class="vfc-btn-next" onclick="renderVotingOpportunity('${esc(code)}',${voterNum+1},0)">START NEXT VOTER</button>
        <button class="vfc-btn-done" onclick="endVotingAndShowRankings('${esc(code)}',${voterNum})">END VOTING &amp; SEE RANKINGS</button>
      </div>
    </div>
  `);
}

function endVotingAndShowRankings(code,totalVoters){
  const ev=DB.getEvent(code);if(!ev)return;
  const votes=DB.getVotes2(code);
  const ops=ev.opportunities||[];
  const scoreMap={};
  votes.forEach(v=>{
    if(!scoreMap[v.opportunityId])scoreMap[v.opportunityId]={total:0,count:0};
    scoreMap[v.opportunityId].total+=v.rating;
    scoreMap[v.opportunityId].count++;
  });
  const ranked=ops.map((op,i)=>{
    const s=scoreMap[op.id]||{total:0,count:0};
    const avg=s.count>0?Math.round(s.total/s.count*10)/10:0;
    return{id:op.id,description:op.description,avg,voteCount:s.count,order:i};
  }).sort((a,b)=>b.avg-a.avg||a.order-b.order);
  if(!ev.voting)ev.voting={};
  ev.voting.status='locked';ev.voting.ranked=ranked;
  ev.voting.voterCount=totalVoters;ev.voting.closedAt=new Date().toISOString();
  DB.saveEvent(ev);
  renderVotingResults(code);
}

function renderVotingResults(code){
  const ev=DB.getEvent(code);if(!ev)return;
  const ranked=ev.voting?.ranked||[];
  const voterCount=ev.voting?.voterCount||0;
  const medals=['🥇','🥈','🥉'];
  renderVoting(`
    <div class="vfs">
      <div class="vfs-inner">
        <div style="text-align:center;padding-top:20px;">
          <div style="font-size:40px;margin-bottom:4px;">🏆</div>
          <div class="vfr-title">Voting Results</div>
          <div style="font-size:14px;color:rgba(255,255,255,.6);margin-bottom:28px;">${esc(ev.name)} · ${voterCount} voter${voterCount!==1?'s':''}</div>
        </div>
        ${ranked.map((op,i)=>`
          <div class="vfr-row" style="animation-delay:${i*0.07}s">
            <div class="vfr-rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${medals[i]||i+1}</div>
            <div class="vfr-desc">${esc(op.description)}</div>
            <div class="vfr-score">${op.avg.toFixed(1)} ⭐<br><span style="font-size:12px;font-weight:600;">(${op.voteCount} vote${op.voteCount!==1?'s':''})</span></div>
          </div>
        `).join('')}
        ${ranked.length===0?`<div style="text-align:center;padding:40px;color:rgba(255,255,255,.5);font-size:16px;">No votes recorded.</div>`:''}
        <button class="vfr-back" onclick="returnToAdminFromVoting('${esc(code)}')">BACK TO ADMIN</button>
      </div>
    </div>
  `);
}

function returnToAdminFromVoting(code){
  S.eventCode=code;
  renderEvent(code,'admin');
}

function handleVotingEscape(code){
  _escapeCount++;
  clearTimeout(_escapeTimer);
  if(_escapeCount>=3){
    _escapeCount=0;
    const ev=DB.getEvent(code);
    if(ev&&ev.voting&&ev.voting.status==='voting'){
      ev.voting.status=null;
      DB.saveEvent(ev);
    }
    toast('Emergency exit — returned to admin.');
    renderEvent(code,'admin');
  } else {
    _escapeTimer=setTimeout(()=>{_escapeCount=0;},1500);
  }
}

function doResetVoting(code){
  if(!confirm('Clear all vote data and reset to Start Voting?'))return;
  const ev=DB.getEvent(code);if(!ev)return;
  if(ev.voting){ev.voting.status=null;ev.voting.ranked=null;ev.voting.voterCount=0;ev.voting.closedAt=null;}
  (ev.opportunities||[]).forEach(o=>delete o.assigned);
  DB.saveVotes2(code,[]);
  DB.saveEvent(ev);
  _escapeCount=0;clearTimeout(_escapeTimer);
  toast('Voting reset.');
  // If a voting overlay is currently showing, do a full re-render.
  // Otherwise just patch the opp-section in place.
  if(document.querySelector('.vfs')){
    renderEvent(code,'admin');
  } else {
    const el=document.getElementById('opp-section');
    if(el)el.innerHTML=buildOppSectionHTML(code,'admin',DB.getEvent(code));
    else renderEvent(code,'admin');
  }
}

// ── Metrics & Before/After Log (generic — any unit, any category) ──
function computeMetricStats(logs){
  const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10:0;
  const qtys=logs.map(l=>Number(l.qty)||0).filter(v=>v>0);
  const units=logs.map(l=>Number(l.units)||0).filter(v=>v>0);
  const durations=logs.map(l=>Number(l.durationMin)||0).filter(v=>v>0);
  const waits=logs.map(l=>Number(l.waitMin)).filter(v=>!isNaN(v)&&v>=0);
  const totalQty=qtys.reduce((a,b)=>a+b,0);
  const totalUnits=units.reduce((a,b)=>a+b,0);
  const days=new Set(logs.map(l=>l.date).filter(Boolean)).size;
  return{
    count:logs.length,
    days,
    perDay:days>0?Math.round(logs.length/days*10)/10:0,
    avgQty:avg(qtys),
    minQty:qtys.length?Math.min(...qtys):0,
    maxQty:qtys.length?Math.max(...qtys):0,
    avgUnits:avg(units),
    qtyPerUnit:totalUnits>0?Math.round(totalQty/totalUnits*10)/10:0,
    avgDuration:avg(durations),
    avgWait:avg(waits)
  };
}

// directionality 'higherBetter'|'lowerBetter'|null — null shows both values with no judgment
function metricCompareRow(label,beforeVal,afterVal,unit,directionality){
  let deltaHtml='';
  if(directionality&&typeof beforeVal==='number'&&typeof afterVal==='number'&&beforeVal>0){
    const diff=afterVal-beforeVal;
    if(diff!==0){
      const improved=directionality==='higherBetter'?diff>0:diff<0;
      const color=improved?'var(--green)':'var(--red)';
      const pct=Math.round(Math.abs(diff)/beforeVal*100);
      deltaHtml=`<span style="color:${color};font-size:11px;font-weight:800;margin-left:4px;">${diff>0?'▲':'▼'} ${pct}%</span>`;
    }
  }
  return`
    <div style="display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--gray-200);gap:8px;">
      <div class="txt-sm bold" style="flex:1.4;min-width:0;">${esc(label)}</div>
      <div class="txt-sm" style="flex:1;text-align:center;color:var(--gray-600);">${beforeVal}${unit}</div>
      <div class="txt-sm bold" style="flex:1;text-align:center;color:var(--navy);">${afterVal}${unit}${deltaHtml}</div>
    </div>`;
}

function buildCIMetricsSectionHTML(code,ev){
  const allLogs=DB.getMetricLogs(code);
  const beforeLogs=allLogs.filter(l=>l.phase==='before');
  const afterLogs=allLogs.filter(l=>l.phase==='after');
  const bStats=computeMetricStats(beforeLogs);
  const aStats=computeMetricStats(afterLogs);
  const tab=_mtTab;
  const shownLogs=(tab==='before'?beforeLogs:afterLogs).slice().sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  const cats=[...new Set(shownLogs.map(l=>l.category).filter(Boolean))];
  const catLine=cats.length?cats.map(c=>`${c}: ${shownLogs.filter(l=>l.category===c).length}`).join(' · '):'';

  return`<div class="card mb3">
    <div class="card-body">
      <div class="sec-hdr mb2"><span class="sec-title">📊 Metrics & Before/After Log</span></div>
      <p class="txt-xs txt-muted mb3">Log observations before and after your trial — same fields each time — to compare volume, cycle time, and wait.</p>

      ${(beforeLogs.length>0||afterLogs.length>0)?`
        <div style="margin-bottom:14px;">
          <div style="display:flex;padding:0 0 6px;gap:8px;">
            <div style="flex:1.4;"></div>
            <div class="txt-xs bold txt-muted" style="flex:1;text-align:center;text-transform:uppercase;letter-spacing:.5px;">Before</div>
            <div class="txt-xs bold" style="flex:1;text-align:center;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);">After</div>
          </div>
          ${metricCompareRow('Observations/day',bStats.perDay,aStats.perDay,'',afterLogs.length?'higherBetter':null)}
          ${metricCompareRow('Avg quantity',bStats.avgQty,aStats.avgQty,'',null)}
          ${metricCompareRow('Quantity range',bStats.minQty+'–'+bStats.maxQty,aStats.minQty+'–'+aStats.maxQty,'',null)}
          ${metricCompareRow('Avg units used',bStats.avgUnits,aStats.avgUnits,'',null)}
          ${metricCompareRow('Qty per unit',bStats.qtyPerUnit,aStats.qtyPerUnit,'',null)}
          ${metricCompareRow('Avg duration',bStats.avgDuration,aStats.avgDuration,' min',afterLogs.length?'lowerBetter':null)}
          ${metricCompareRow('Avg wait time',bStats.avgWait,aStats.avgWait,' min',afterLogs.length?'lowerBetter':null)}
        </div>
      `:`<div style="text-align:center;padding:20px 10px;color:var(--gray-400);"><p class="txt-sm">No observations logged yet — start with "Before" entries during the current process, then switch to "After" once your trial starts.</p></div>`}

        <button class="tab ${tab==='before'?'on':''}" onclick="setMetricTab('before')">Before (${beforeLogs.length})</button>

      </div>
      ${catLine?`<p class="txt-xs txt-muted mb2">${esc(catLine)}</p>`:''}

      <div id="metric-log-list">
        ${shownLogs.length===0?`<p class="txt-xs txt-muted mb2" style="text-align:center;padding:10px 0;">No "${tab}" observations logged yet.</p>`

function selectMetricPhase(el){
  _mtPhaseSel=el.dataset.val;
  document.querySelectorAll('.mt-phase-opt').forEach(b=>b.classList.toggle('sel',b.dataset.val===_mtPhaseSel));
}
function submitMetricLog(e,code){
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target));
  const log={
    phase:_mtPhaseSel,
    category:(data.category||'').trim(),
    date:data.date,
    qty:Number(data.qty)||0,
    units:Number(data.units)||0,
    durationMin:Number(data.durationMin)||0,
    waitMin:Number(data.waitMin)||0,
    who:(data.who||'').trim(),
    notes:(data.notes||'').trim()
  };
  if(_mtEditId){DB.updateMetricLog(code,_mtEditId,log);toast('Observation updated!');}
  else{DB.addMetricLog(code,log);toast('Observation logged!');}
  _mtTab=_mtPhaseSel;
  closeModal();
  const ev=DB.getEvent(code);
  const el=document.getElementById('ci-metrics-section');
  if(el&&ev)el.innerHTML=buildCIMetricsSectionHTML(code,ev);
}
function doDeleteMetricLog(code,id){
  if(!confirm('Delete this observation? This cannot be undone.'))return;
  DB.deleteMetricLog(code,id);
  closeModal();
  toast('Observation deleted');
  const ev=DB.getEvent(code);
  const el=document.getElementById('ci-metrics-section');
  if(el&&ev)el.innerHTML=buildCIMetricsSectionHTML(code,ev);
}

// SERVICE WORKER
// ═══════════════════════════════════════════════════════════
if('serviceWorker' in navigator){
  // Register SW and immediately check for updates on every page load.
  // reg.update() fetches sw.js fresh from the network each visit so
  // any change to sw.js is detected within one browser open — no manual
  // cache clearing required on any device.
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update(); // force update check right now
    }).catch(()=>{});
  });

  // When a new SW activates and claims this client (via clients.claim()),
  // reload the page so the freshly cached files are used immediately.
  // Guards against double-reload with the `refreshing` flag.
  let _swRefreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!_swRefreshing){
      _swRefreshing=true;
      window.location.reload();
    }
  });
}

// Export every event's full data (event record, action items, votes, metric
// logs) as one downloadable JSON file. This is the only way real data gets
// off a tablet — the PWA's localStorage is sandboxed inside Chrome and isn't
// visible over a plain USB connection, but a browser download does land in
// the device's public Downloads folder, which IS visible over USB.
function exportAllData(){
  try{
    const events=DB.getEvents();
    const data={exportedAt:new Date().toISOString(),events:{}};
    Object.keys(events).forEach(code=>{
      data.events[code]={
        event:events[code],
        items:DB.getItems(code),
        votes:DB.getVotes2(code),
        metricLogs:DB.getMetricLogs(code)
      };
    });
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,10);
    a.href=url;
    a.download=`kaizen-tracker-export-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Export saved to your Downloads folder!');
  }catch(e){
    toast('Export failed: '+e.message);
  }
}

// Manual "check for update" button — the automatic check above only fires
// once per page load, which isn't very visible/trustworthy on a tablet that
// stays open for days. This forces an immediate check on demand. If a new
// version is found, the controllerchange listener above reloads the page
// automatically — this function doesn't need to do that itself.
function checkForUpdate(){
  if(!('serviceWorker' in navigator)){toast("Updates aren't supported in this browser.");return;}
  toast('Checking for updates…');
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(!reg){toast('No update service found — fully close and reopen the app.');return;}
    reg.update().then(()=>{
      setTimeout(()=>{
        // If an update was found, the page has already reloaded by now via
        // the controllerchange listener. Still here means nothing was new.
        toast("You're already on the latest version!");
      },2500);
    }).catch(()=>toast('Update check failed — check your connection.'));
  });
}
